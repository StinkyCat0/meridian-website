name: Feature request
description: A scoped improvement to the public site or API
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that solves it. Note what stays out of scope.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web, API, Integration, Docs, Deployment]
    validations:
      required: true
