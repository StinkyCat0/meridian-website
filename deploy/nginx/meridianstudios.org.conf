# /etc/nginx/conf.d/meridianstudios.org.conf
#
# Meridian Studios production site. Serves the built SPA from
# /usr/share/nginx/meridianstudios.org and proxies the API, Socket.IO and
# uploaded files to the loopback-only API on 127.0.0.1:2000.
#
# The live host is Arch-style: nginx.conf includes /etc/nginx/conf.d/*.conf in
# the http context. Install all three nginx files side by side there, keeping
# the 00- prefixes so the maps/zones are parsed before this site block.
#
# Ingress model (important):
#   * Production traffic arrives through Cloudflare Tunnel. cloudflared runs on
#     this host and forwards the public HTTPS request to nginx as plain HTTP on
#     loopback. That is why this server block binds port 80 to 127.0.0.1 / ::1
#     only and deliberately does NOT redirect HTTP to HTTPS: the tunnel's
#     origin leg is HTTP by design. Port 80 is not publicly reachable.
#   * A public TLS listener on 443 is kept for direct HTTPS access/fallback.
#     Certificates and their renewal are managed outside this repository; the
#     paths below are the host's deploy-time locations. If the direct listener
#     is not needed, remove the 443 listens (or firewall 443) and rely solely
#     on the tunnel.
#   * One server block serves both listeners so the routing rules exist once.
#     $server_port (80 = tunnel, 443 = direct) selects the client-IP and
#     forwarded-proto behavior defined in 00-rate-limits.conf.
#
# Prerequisites (installed once, see docs/DEPLOYMENT.md):
#   /etc/nginx/conf.d/00-websocket-upgrade.conf  (map $http_upgrade)
#   /etc/nginx/conf.d/00-rate-limits.conf        (client-IP maps + limit_req_zone)
#
# Install:
#   sudo install -m 0644 deploy/nginx/00-websocket-upgrade.conf \
#     /etc/nginx/conf.d/00-websocket-upgrade.conf
#   sudo install -m 0644 deploy/nginx/00-rate-limits.conf \
#     /etc/nginx/conf.d/00-rate-limits.conf
#   sudo install -m 0644 deploy/nginx/meridianstudios.org.conf \
#     /etc/nginx/conf.d/meridianstudios.org.conf
# Confirm nginx.conf has `include /etc/nginx/conf.d/*.conf;` in its http block.
#
# Validate after every change, before reloading:
#   sudo nginx -t && sudo systemctl reload nginx
# A failed `nginx -t` leaves the running configuration untouched.
#
# The companion deployment workflow builds/publishes the SPA and restarts the
# API; it never installs, edits, or reloads nginx configuration.

server {
    # Cloudflare Tunnel origin (loopback only, plain HTTP).
    listen 127.0.0.1:80;
    listen [::1]:80;

    # Direct public HTTPS (fallback path). This host runs nginx 1.30, where
    # `listen ... http2` is deprecated. `http2 on` requires nginx 1.25.1+; if
    # you deploy to an older nginx, use `listen 443 ssl http2;` instead.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name meridianstudios.org www.meridianstudios.org;

    root /usr/share/nginx/meridianstudios.org;
    index index.html;

    server_tokens off;
    autoindex off;

    # 10 MiB API upload limit plus multipart overhead.
    client_max_body_size 12m;

    # --- TLS ---------------------------------------------------------------
    # Certificates are issued/rotated outside this repository. These are the
    # host's current paths, not a claim about the issuing CA.
    ssl_certificate     /etc/nginx/ssl/meridianstudios.org.crt;
    ssl_certificate_key /etc/nginx/ssl/meridianstudios.org.key;

    # Alternative paths, only if this host is switched to a Let's Encrypt
    # lineage managed by certbot:
    # ssl_certificate     /etc/letsencrypt/live/meridianstudios.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/meridianstudios.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    # ECDHE-only suites for TLS 1.2; TLS 1.3 suites are fixed by OpenSSL.
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    ssl_session_cache shared:MeridianTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Optional OCSP stapling for the direct TLS listener. Uncomment only after
    # confirming the chain file and host DNS resolution:
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/ssl/meridianstudios.org-chain.crt;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;

    # --- Security headers --------------------------------------------------
    # nginx add_header inheritance: a location that declares ANY add_header
    # stops inheriting ALL server-level add_headers. The /assets/ and
    # /uploads/ locations repeat the full set below intentionally; keep the
    # copies in sync when editing.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Report-Only on purpose. Review violations in the browser console and in
    # the SPA's error telemetry before switching this to an enforcing
    # Content-Security-Policy. Sources reflect the checked-in index.html and
    # components: Stripe.js, Cloudflare Insights, Google Fonts, Unsplash demo
    # imagery, and self-hosted demo video.
    #
    # script-src deliberately has no 'unsafe-inline' and no 'unsafe-eval'.
    # If a production build introduces inline scripts, fix the build (external
    # asset or hash/nonce) instead of weakening script-src.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://js.stripe.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self'; connect-src 'self' wss://meridianstudios.org wss://www.meridianstudios.org https://api.stripe.com https://m.stripe.com https://m.stripe.network https://cloudflareinsights.com; frame-src https://js.stripe.com https://hooks.stripe.com https://m.stripe.network; worker-src 'self' blob:; manifest-src 'self'" always;

    access_log /var/log/nginx/meridianstudios.access.log;
    error_log  /var/log/nginx/meridianstudios.error.log warn;

    # --- Proxy defaults ----------------------------------------------------
    # Client identity is normalized by the maps in 00-rate-limits.conf:
    # CF-Connecting-IP on the loopback tunnel listener, peer address on 443.
    # nginx sends exactly one client address, so the API's trust proxy setting
    # of one hop is correct.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $meridian_client_ip;
    proxy_set_header X-Forwarded-For   $meridian_client_ip;
    proxy_set_header X-Forwarded-Proto $meridian_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # --- API routes --------------------------------------------------------
    # Longest-prefix matching puts auth/contact ahead of /api/. Zones are
    # defined in /etc/nginx/conf.d/00-rate-limits.conf. 429 (not the nginx
    # default 503) keeps client retry behavior predictable.

    location ^~ /api/auth/ {
        limit_req zone=meridian_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:2000;
    }

    # The contact router is mounted at /api/contact (POST /). A `^~` prefix is
    # used instead of a regex so it wins over the ^~ /api/ prefix and still
    # matches a trailing slash; there are no other /api/contact* routes.
    location ^~ /api/contact {
        limit_req zone=meridian_contact burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:2000;
    }

    location ^~ /api/ {
        limit_req zone=meridian_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:2000;
    }

    # --- Socket.IO ---------------------------------------------------------
    # This location was missing on the live host, which broke chat. Keep it.
    # proxy_buffering off and a long read timeout keep the WebSocket alive;
    # $connection_upgrade comes from 00-websocket-upgrade.conf.
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:2000;
        proxy_buffering off;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Uploaded chat attachments ----------------------------------------
    # Also missing on the live host. Served by the API with generated
    # filenames; proxy only. No listing, and nosniff is part of the repeated
    # header set.
    location ^~ /uploads/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://js.stripe.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self'; connect-src 'self' wss://meridianstudios.org wss://www.meridianstudios.org https://api.stripe.com https://m.stripe.com https://m.stripe.network https://cloudflareinsights.com; frame-src https://js.stripe.com https://hooks.stripe.com https://m.stripe.network; worker-src 'self' blob:; manifest-src 'self'" always;

        autoindex off;
        proxy_pass http://127.0.0.1:2000;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 60s;
    }

    # --- SPA static assets -------------------------------------------------
    # Vite emits content-hashed filenames under /assets/; cache them forever.
    # The full header set is repeated because of add_header inheritance.
    location ^~ /assets/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://js.stripe.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self'; connect-src 'self' wss://meridianstudios.org wss://www.meridianstudios.org https://api.stripe.com https://m.stripe.com https://m.stripe.network https://cloudflareinsights.com; frame-src https://js.stripe.com https://hooks.stripe.com https://m.stripe.network; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        access_log off;
        try_files $uri =404;
    }

    # --- SPA fallback ------------------------------------------------------
    # HTML and unhashed static files must not be cached long-term. `expires -1`
    # emits Cache-Control: no-cache without add_header, so the server-level
    # security headers continue to apply here.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # --- Dotfiles ----------------------------------------------------------
    # Deny hidden files (.git, .env, editor droppings) while allowing the
    # ACME/verification path. The regex location is evaluated before the
    # prefix locations above except `^~`.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }
}
