# /etc/nginx/conf.d/00-websocket-upgrade.conf
#
# Shared WebSocket upgrade map for Socket.IO. This file must live in a
# directory included from the *http* context of nginx.conf. The live host is
# Arch-style and installs it as /etc/nginx/conf.d/00-websocket-upgrade.conf
# alongside the site block; the site config must not redeclare this map.
#
# Install:
#   sudo install -m 0644 deploy/nginx/00-websocket-upgrade.conf \
#     /etc/nginx/conf.d/00-websocket-upgrade.conf
#
# Validate after every change:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The companion deployment workflow builds and publishes the web/API code but
# never installs or edits nginx configuration; these files are applied by hand.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
