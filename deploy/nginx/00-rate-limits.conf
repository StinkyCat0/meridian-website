# /etc/nginx/conf.d/00-rate-limits.conf
#
# Edge traffic-control definitions: client-address normalization plus the
# limit_req zones that use it. This file must live in a directory included
# from the *http* context of nginx.conf. The live host is Arch-style: install
# it as /etc/nginx/conf.d/00-rate-limits.conf. Its filename sorts before
# meridianstudios.org.conf, so nginx parses these definitions first.
#
# Why the maps: the production ingress is Cloudflare Tunnel. cloudflared
# connects to nginx over loopback, so $remote_addr is 127.0.0.1 for every
# visitor. The real client address is Cloudflare's CF-Connecting-IP header.
# Trust that header ONLY on the loopback tunnel listener (server_port 80);
# on the public TLS listener (443) use the peer address so a direct client
# cannot spoof it and evade per-IP limits.
#
# Install:
#   sudo install -m 0644 deploy/nginx/00-rate-limits.conf \
#     /etc/nginx/conf.d/00-rate-limits.conf
#
# Validate after every change:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The companion deployment workflow never installs or edits nginx config.

map $http_cf_connecting_ip $meridian_tunnel_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

map $server_port $meridian_client_ip {
    default $remote_addr;
    80      $meridian_tunnel_client_ip;
}

# Public traffic is HTTPS at the Cloudflare edge (or on the direct 443
# listener). Preserve Cloudflare's X-Forwarded-Proto on the tunnel listener and
# fall back to the local scheme elsewhere.
map $http_x_forwarded_proto $meridian_tunnel_proto {
    default $http_x_forwarded_proto;
    ''      https;
}

map $server_port $meridian_forwarded_proto {
    default $scheme;
    80      $meridian_tunnel_proto;
}

# Authentication endpoints: strict. 10 per minute sustained per client IP,
# small burst for retries. The API enforces its own 10-per-15-minutes limit.
limit_req_zone $meridian_client_ip zone=meridian_auth:10m rate=10r/m;

# Public contact form: strict. 5 submissions per minute sustained.
limit_req_zone $meridian_client_ip zone=meridian_contact:10m rate=5r/m;

# General API: moderate. 120 requests per minute per client IP, burst of 60 for
# SPA page loads that issue several parallel requests.
limit_req_zone $meridian_client_ip zone=meridian_api:10m rate=120r/m;

# Log throttled requests at warn so operators can distinguish abuse from
# application errors. limit_req_status is set per location (429, not 503).
limit_req_log_level warn;
