<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="meridian-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="2" y="2" width="28" height="28" rx="6" ry="6" fill="url(#meridian-gradient)" />
  
  <!-- White diagonal line (rotated 45°) -->
  <line x1="10" y1="22" x2="22" y2="10" stroke="white" stroke-width="2.5" stroke-linecap="round" />
</svg>
